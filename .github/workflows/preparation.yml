name: Annotation preparation
on: [push, pull_request, workflow_dispatch]
jobs:
  cpu-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-preparation.txt
      - run: python -m unittest discover -s tests -v
      - run: python src/prepare_annotations.py --families
      - run: python src/prepare_attributes.py
      - run: python src/prepare_splits.py segmentation --source data/prepared --output data/prepared_split
